name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --prefer-offline --no-fund
        env:
          # Keep the default audit request, but bound registry outages/retries.
          NPM_CONFIG_FETCH_TIMEOUT: '15000'
          NPM_CONFIG_FETCH_RETRIES: '0'
      - run: npm test
      - run: python3 scripts/check-public-files.py
      - run: python3 runtime/test_minicpm_protocol.py
      - run: python3 runtime/test_speech_protocol.py
      - run: python3 -m compileall -q infra runtime scripts
